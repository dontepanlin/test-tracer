# Example scenario topology for test-tracer.
#
# Netlab builds this topology (linux containers for the servers, an EOS
# router in the middle) and applies native `tc` link impairment on
# mongo1-router. The `scenario:` block tells the scenario runner what to
# capture and which traffic to run, as a step timeline.
#
# Run with:
#
#     scenario -t example/topology.yml -p clab
#
# Inspect the parsed scenario:
#
#     scenario describe -t example/topology.yml
#
name: scenario-ex
provider: clab
defaults:
  device: linux
  group: test-group
  mgmt_base: 192.0.2
  mgmt_prefix: 24
  mgmt_mode: static
  addressing:
    v4_pool: 10.1.0.0/24
  # Declare the custom top-level `scenario` attribute so netlab accepts it.
  attributes:
    global:
      scenario: { type: dict }

nodes:
  mongo1: { device: linux }
  mongo2: { device: linux }
  bt-seed: { device: linux }
  router: { device: eos }

links:
  # Bad WAN link: 50 ms delay, 2% loss (applied by netlab up via tc)
  - interfaces: [ mongo1, router ]
    tc: { delay: 50, loss: 2 }
  - interfaces: [ mongo2, router ]
  - interfaces: [ bt-seed, router ]

scenario:
  name: mongodb_bittorrent_test
  results: results

  # Wait for routing / BGP to converge.
  verify:
    - wait: 30

  # --- HOW to capture (named definitions) -------------------------------
  captures:
    - id: mongo_sync
      node: mongo1
      link: 0
      filter: "port 27017"
      output: mongo_sync.pcap
    - id: bittorrent
      node: bt-seed
      link: 0
      filter: "port 6881"
      output: bittorrent.pcap

  # --- WHEN + WHAT (the timeline) ----------------------------------------
  steps:
    # MongoDB replication-style traffic across the tc-impaired link.
    - name: mongo-sync
      capture: [mongo_sync]
      do:
        - playbook: playbooks/mongo_sync.yml
      # The traffic generator must report that it started.
      assert: { contains: "started" }

    # BitTorrent-style seed traffic.
    - name: bt-seed
      capture: [bittorrent]
      do:
        - playbook: playbooks/seed_torrent.yml
      assert: { contains: "started" }

    # Let the bounded traffic generators finish so the captures record a
    # full window before they are stopped at the end of the step.
    - name: settle
      do:
        - command: "sleep 35"
