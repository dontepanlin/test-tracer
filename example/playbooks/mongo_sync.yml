---
# Example traffic generator: MongoDB-style replication traffic.
#
# Runs against the netlab-generated inventory (hosts.yml). Each mongo node
# pushes a stream of data to its peer over port 27017 (using python3, which
# is available in the netlab linux images) so that the tcpdump capture on
# mongo1/eth1 (filter "port 27017") records real traffic across the
# tc-impaired link.
#
# Replace with real mongod seeding / replication logic as needed.

- name: Generate MongoDB replication-style traffic
  hosts: mongo1
  gather_facts: false
  vars:
    peer_host: "{{ hostvars['mongo2'].ansible_host }}"
  tasks:
    - name: Push ~200 KB of data to mongo2:27017 (background, 30s)
      ansible.builtin.shell: >
        setsid nohup python3 -c '
        import socket, os, time
        s = socket.create_connection(("{{ peer_host }}", 27017), timeout=10)
        chunk = os.urandom(4096)
        start = time.time()
        while time.time() - start < 30:
            s.sendall(chunk)
        s.close()
        ' >/tmp/mongo_sync.log 2>&1 < /dev/null &
        echo started
      register: _
      changed_when: true
