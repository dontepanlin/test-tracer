- name: Collect generated ldap passwd
  hosts: ldap-server
  gather_facts: false
  tasks:
    - name: Fetch container logs
      # The docker container name is NOT the node name; netlab/clab exposes it
      # as the 'hostname' hostvar (clab-<lab>-<node>).
      ansible.builtin.command: docker logs {{ hostname }}
      delegate_to: localhost
      register: _ldap_container_logs
      changed_when: false
      failed_when: false

    - name: Extract_generated_root_password_from_logs
      ansible.builtin.set_fact:
        # regex_search looks for the pattern.
        # (\S+) captures the non-whitespace characters (the password).
        # '\1' tells regex_search to return ONLY the captured group.
        # default('') guards against an empty/failed `docker logs` (stdout=None);
        # regex_search's default= makes a no-match return ['NOT_FOUND'] instead
        # of None (which would crash the `first` filter before `default` runs).
        generated_root_password: >-
          {{
            (_ldap_container_logs.stdout | default('')) |
            regex_search('WARNING Generated database root password: (\S+)', '\1', default='NOT_FOUND') | first
          }}

    - name: Fail if password was not found
      ansible.builtin.fail:
        msg: "generated root password not found in docker logs of {{ inventory_hostname }}"
      when: generated_root_password == 'NOT_FOUND'

    # Facts do not survive across ansible-playbook invocations: every
    # scenario action runs in its own invocation. So persist the password to
    # a well-known file under the lab directory (inventory_dir is the lab
    # dir, since the runner invokes with `-i hosts.yml` from there); later
    # steps read it back with lookup('file', inventory_dir + '/vars/...').
    - name: Ensure vars dir exists
      ansible.builtin.file:
        path: "{{ inventory_dir }}/vars"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Persist generated root password for later steps
      ansible.builtin.copy:
        dest: "{{ inventory_dir }}/vars/generated_root_password"
        content: "{{ generated_root_password }}\n"
        mode: "0600"
      delegate_to: localhost
