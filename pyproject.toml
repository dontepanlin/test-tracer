[project]
name = "test-tracer"
version = "0.1.0"
description = "netlab-based network scenario runner: build topology, apply tc, capture PCAPs, run traffic via Ansible"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.21.5",
    "networklab>=26.10",
    "pyyaml>=6.0.3",
]

[project.scripts]
scenario = "test_tracer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_tracer"]
